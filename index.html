<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INCA Fitness Club – Planificaciones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
  :root{--orange:#E8511A;--cream:#EDE8E0;--dark:#3A3A3A;--div:rgba(58,58,58,0.18);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Barlow',sans-serif;background:#2a2a2a;color:var(--dark);height:100vh;overflow:hidden;}

  /* LOADING */
  #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:28px;}
  .load-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:52px;color:var(--orange);letter-spacing:4px;text-align:center;line-height:1;}
  .load-title span{display:block;font-size:16px;color:#888;letter-spacing:6px;font-weight:400;margin-top:6px;}
  .load-box{background:#333;border:2px dashed #555;border-radius:14px;padding:52px 72px;text-align:center;max-width:480px;width:100%;}
  .load-icon{font-size:40px;margin-bottom:12px;}
  .load-box h2{color:#eee;font-size:18px;font-weight:600;margin-bottom:8px;}
  .load-box p{color:#888;font-size:13px;line-height:1.7;}
  #load-error{margin-top:8px;}
  .error-msg{color:#e74c3c;font-size:14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:12px 20px;max-width:460px;text-align:center;}
  .retry-btn{margin-top:12px;background:var(--orange);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;}

  /* APP */
  #app{display:none;height:100vh;flex-direction:column;}

  .app-header{background:var(--dark);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--orange);flex-shrink:0;}
  .week-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .week-tab{background:#2a2a2a;color:#aaa;border:1px solid #555;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;transition:all 0.15s;white-space:nowrap;}
  .week-tab:hover{border-color:var(--orange);color:var(--orange);}
  .week-tab.active{background:var(--orange);color:#fff;border-color:var(--orange);}
  .header-btns{display:flex;gap:6px;align-items:center;}
  .btn-action{background:transparent;color:#aaa;border:1.5px solid #555;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;transition:all 0.15s;}
  .btn-action:hover{color:#eee;border-color:#888;}
  .btn-orange{color:var(--orange);border-color:var(--orange);}
  .btn-orange:hover{background:var(--orange);color:#fff;}

  .day-nav{background:#222;padding:0 20px;display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #333;flex-shrink:0;}
  .day-nav::-webkit-scrollbar{display:none;}
  .day-btn{padding:8px 18px;background:transparent;border:none;border-bottom:3px solid transparent;color:#666;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:'Barlow',sans-serif;text-transform:uppercase;transition:all 0.15s;white-space:nowrap;text-align:center;line-height:1.4;}
  .day-btn:hover{color:#aaa;}
  .day-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

  /* CARD AREA */
  #days-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
  .day-slide{display:none;flex:1;flex-direction:column;min-height:0;}
  .day-slide.active{display:flex;}

  .canva-card{background:var(--cream);width:100%;height:100%;display:flex;flex-direction:column;}

  .card-top{background:var(--dark);padding:10px 24px;display:flex;align-items:center;flex-shrink:0;}
  .card-day-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(18px,3vh,28px);font-weight:800;letter-spacing:4px;color:var(--cream);text-transform:uppercase;line-height:1;margin-right:14px;}
  .card-day-date{font-size:clamp(11px,1.5vh,14px);color:#999;font-weight:400;letter-spacing:2px;}

  .disc-headers{background:var(--dark);display:grid;border-top:1px solid #555;flex-shrink:0;}
  .disc-hdr{padding:clamp(6px,1vh,10px) 12px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:clamp(16px,2.5vh,26px);font-weight:800;letter-spacing:3px;color:var(--cream);border-right:1px solid #555;text-transform:uppercase;}
  .disc-hdr:last-child{border-right:none;}

  .disc-body{display:grid;flex:1;min-height:0;}
  .disc-col{padding:14px 18px;border-right:1px solid var(--div);text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .disc-col:last-child{border-right:none;}

  .shared-row{padding:14px 20px;text-align:center;border-bottom:1px solid var(--div);background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* WOD TEXT */
  .wod-text{font-family:'Barlow',sans-serif;font-size:clamp(12px,1.9vw,24px);line-height:1.5;color:var(--dark);width:100%;word-break:break-word;overflow-wrap:break-word;}
  .wod-bold{display:block;font-weight:700;}
  .wod-line{display:block;font-weight:700;}
  .wod-div{display:block;border:none;border-top:1px solid var(--div);margin:10px auto;width:70%;}
  .wod-empty{color:#aaa;font-style:italic;font-size:0.88em;}

  @media print{
    body{background:white;}
    .app-header,.day-nav{display:none!important;}
    #days-wrap{height:auto;}
    .day-slide{display:flex!important;page-break-after:always;}
    .day-slide:last-child{page-break-after:avoid;}
    .canva-card{height:auto;}
    .wod-text{font-size:11px;}
  }
</style>
</head>
<body>

<div id="loading">
  <div class="load-title">INCA FITNESS CLUB<span>PLANIFICACIONES SEMANALES</span></div>
  <div class="load-box">
    <div class="load-icon">⏳</div>
    <h2>Cargando planificaciones...</h2>
    <p>Conectando con Google Sheets</p>
  </div>
  <div id="load-error"></div>
</div>

<div id="app">
  <div class="app-header">
    <div class="week-tabs" id="week-tabs"></div>
    <div class="header-btns">
      <button class="btn-action btn-orange" onclick="window.print()">🖨 Imprimir</button>
      <button class="btn-action" onclick="toggleFS()">⛶ Pantalla completa</button>
      <button class="btn-action" onclick="loadData()">↺ Actualizar</button>
    </div>
  </div>
  <div class="day-nav" id="day-nav"></div>
  <div id="days-wrap"></div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxE6t91W7SR6Sn6DnpB2K7J7nGQWxZJYcaWptWpfv5sCstAVEy_r7TXQUWmbNNxHNtK2Q/exec';
const DAYS_ES=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const COL_IDX=[1,4,7,10,13,16];
const DISC=['CROSSFIT','FUNCIONAL','GAP'];

let allWeeks=[],currentWeek=0,currentDay=0;

/* ── LOAD DATA ── */
function loadData(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('load-error').innerHTML='';

  const cb='inca_cb_'+Date.now();
  const sc=document.createElement('script');
  window[cb]=function(raw){
    delete window[cb];
    document.head.removeChild(sc);
    try{
      const {rows,html}=parseRaw(raw);
      allWeeks=buildWeeks(rows,html);
      if(!allWeeks.length) throw new Error('No se encontraron semanas.');
      currentWeek=findCurrentWeek();
      currentDay=0;
      renderApp();
    }catch(e){showErr(e.message);}
  };
  sc.onerror=function(){delete window[cb];showErr('No se pudo conectar con Google Sheets.');};
  sc.src=SCRIPT_URL+'?callback='+cb;
  document.head.appendChild(sc);
}

function showErr(msg){
  document.getElementById('load-error').innerHTML=
    '<div class="error-msg">⚠️ '+msg+'<br><button class="retry-btn" onclick="loadData()">Reintentar</button></div>';
}

/* ── PARSE RAW DATA FROM SCRIPT ── */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function parseRaw(raw){
  const rows=[],html={};
  const COLS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function colLetter(ci){return ci<26?COLS[ci]:COLS[Math.floor(ci/26)-1]+COLS[ci%26];}
  raw.forEach((row,ri)=>{
    const pr=[];
    row.forEach((cell,ci)=>{
      let plain='',h='';
      if(!cell){plain='';h='';}
      else if(cell.parts){
        plain=cell.parts.map(p=>p.text).join('');
        h=cell.parts.map(p=>p.bold?'<b>'+esc(p.text)+'</b>':esc(p.text)).join('');
        h=h.split('\r\n').join('<br>').split('\n').join('<br>');
      }else{
        plain=String(cell.text||'');
        h=esc(plain).split('\r\n').join('<br>').split('\n').join('<br>');
      }
      plain=plain.split('\r\n').join('\n').split('\r').join('\n');
      pr.push(plain);
      const addr=colLetter(ci)+(ri+1);
      if(h) html[addr]=h;
    });
    rows.push(pr);
  });
  return{rows,html};
}

/* ── BUILD WEEKS ── */
function buildWeeks(rows,htmlMap){
  const weeks=[];
  const fechaIdxs=[];
  for(let i=0;i<rows.length;i++){if(rows[i]&&rows[i][0]==='FECHA')fechaIdxs.push(i);}
  if(!fechaIdxs.length)return weeks;

  let baseDate=null;
  const raw0=rows[fechaIdxs[0]][2];
  if(raw0){const d=new Date(raw0);if(!isNaN(d))baseDate=d;}
  if(!baseDate)return weeks;

  const COLS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function colLetter(ci){return ci<26?COLS[ci]:COLS[Math.floor(ci/26)-1]+COLS[ci%26];}

  fechaIdxs.forEach((fi,w)=>{
    const lunes=new Date(baseDate);
    lunes.setDate(baseDate.getDate()+w*7);
    const cfR=rows[fi+2]||[],funR=rows[fi+3]||[],gapR=rows[fi+4]||[];
    const days=COL_IDX.map(ci=>{
      function addr(ri){return colLetter(ci)+(ri+1);}
      return{
        cf:(cfR[ci]||'').trim(), fun:(funR[ci]||'').trim(), gap:(gapR[ci]||'').trim(),
        cfH:htmlMap[addr(fi+2)]||null,
        funH:htmlMap[addr(fi+3)]||null,
        gapH:htmlMap[addr(fi+4)]||null,
      };
    });
    weeks.push({lunes,days});
  });
  return weeks;
}

/* ── DATE HELPERS ── */
function fmt(d,offset){
  if(!d)return'';
  const x=new Date(d);x.setDate(x.getDate()+(offset||0));
  return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear();
}
function weekLabel(w){return w.lunes?fmt(w.lunes,0)+' – '+fmt(w.lunes,5):'—';}

function findCurrentWeek(){
  const today=new Date();today.setHours(0,0,0,0);
  let best=0;
  for(let i=0;i<allWeeks.length;i++){
    const l=new Date(allWeeks[i].lunes);l.setHours(0,0,0,0);
    const s=new Date(l);s.setDate(l.getDate()+5);
    if(today>=l&&today<=s)return i;
    if(today>s)best=i;
  }
  return Math.min(best,allWeeks.length-1);
}

function getVisible(cur){
  const total=allWeeks.length;
  let start=Math.max(0,cur-1);
  let end=Math.min(total-1,start+2);
  start=Math.max(0,end-2);
  const v=[];for(let i=start;i<=end;i++)v.push(i);return v;
}

/* ── IDEM RESOLUTION ── */
const IDEM_RE=/^[AB]\.\s*IDEM\s+BLOQUE\s+([AB])\s+(CROSSFIT|FUNCIONAL|GAP)/i;

function extractBlock(text,letter){
  const lines=(text||'').split('\n');
  let cap=false,out=[];
  for(const l of lines){
    const t=l.trim();
    if(!cap){
      if(letter==='A'&&/^A[\.\s]/i.test(t)){cap=true;out=[l];}
      else if(letter==='B'&&/^B[\.\s]/i.test(t)){cap=true;out=[l];}
    }else{
      if(letter==='A'&&/^B[\.\s]/i.test(t))break;
      if(letter==='B'&&/^A[\.\s]/i.test(t))break;
      out.push(l);
    }
  }
  return out.join('\n').trim();
}

function resolveDay(day){
  const orig={cf:day.cf,fun:day.fun,gap:day.gap};
  const origH={cf:day.cfH,fun:day.funH,gap:day.gapH};
  const dmap={crossfit:'cf',funcional:'fun',gap:'gap'};

  // Detecta si un texto es 100% IDEM y devuelve la disciplina fuente
  function cloneSrc(text){
    if(!text)return null;
    const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
    if(!lines.length)return null;
    if(!lines.every(l=>IDEM_RE.test(l)))return null;
    const srcs=new Set();
    for(const l of lines){const m=l.match(IDEM_RE);if(m)srcs.add(m[2].toLowerCase());}
    return srcs.size===1?dmap[[...srcs][0]]:null;
  }

  const cloneOf={cf:cloneSrc(orig.cf),fun:cloneSrc(orig.fun),gap:cloneSrc(orig.gap)};

  // Resuelve texto: reemplaza líneas IDEM por el contenido real del bloque referenciado
  function resolveText(text){
    if(!text)return text;
    const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
    if(lines.every(l=>IDEM_RE.test(l))){
      let res='';
      for(const l of lines){
        const m=l.match(IDEM_RE);
        if(m){
          const blk=m[1].toUpperCase();
          const src=dmap[m[2].toLowerCase()];
          const ex=extractBlock(orig[src],blk);
          if(ex)res+=(res?'\n':'')+ex;
        }
      }
      return res;
    }
    const out=[];
    for(const raw of text.split('\n')){
      const t=raw.trim();const m=t.match(IDEM_RE);
      if(m){
        const blk=m[1].toUpperCase();
        const src=dmap[m[2].toLowerCase()];
        const ex=extractBlock(orig[src],blk);
        if(ex)out.push(ex);
      }else out.push(raw);
    }
    return out.join('\n');
  }

  // Para HTML: si es clon completo usamos el HTML de la fuente.
  // Si el HTML tiene IDEM mezclado, devolvemos null y fmtWOD usa el texto resuelto como fallback.
  function resolveH(h,key,resolvedText){
    if(!resolvedText||!resolvedText.trim())return null;
    const cs=cloneOf[key];
    if(cs)return origH[cs]||null;
    if(!h)return null;
    if(!/IDEM/i.test(h))return h;
    return null;
  }

  const cfR=resolveText(orig.cf);
  const funR=resolveText(orig.fun);
  const gapR=resolveText(orig.gap);

  return{
    cf:cfR, fun:funR, gap:gapR,
    cfH:resolveH(origH.cf,'cf',cfR),
    funH:resolveH(origH.fun,'fun',funR),
    gapH:resolveH(origH.gap,'gap',gapR),
    cloneOf
  };
}

/* ── FORMAT WOD HTML ── */
function parseHTMLSource(htmlSrc){
  if(!htmlSrc)return null;
  const parts=[];
  let i=0,cur='',bold=false;
  const s=htmlSrc;
  while(i<s.length){
    const ch=s[i];
    if(ch==='<'){
      const end=s.indexOf('>',i);if(end===-1){cur+=ch;i++;continue;}
      const tag=s.slice(i,end+1).toLowerCase();
      if(tag==='<b>'||tag.startsWith('<b ')){if(cur)parts.push({t:cur,b:bold});cur='';bold=true;i=end+1;}
      else if(tag==='</b>'){if(cur)parts.push({t:cur,b:true});cur='';bold=false;i=end+1;}
      else if(tag.startsWith('<br')){cur+='\n';i=end+1;}
      else i=end+1;
    }else if(ch==='&'){
      const semi=s.indexOf(';',i);
      if(semi>i&&semi-i<=7){
        const e=s.slice(i,semi+1);
        if(e==='&amp;')cur+='&';else if(e==='&lt;')cur+='<';else if(e==='&gt;')cur+='>';else if(e==='&nbsp;')cur+=' ';else cur+=e;
        i=semi+1;
      }else{cur+=ch;i++;}
    }else{cur+=ch;i++;}
  }
  if(cur)parts.push({t:cur,b:bold});

  let full='';
  for(const p of parts)full+=p.b?'\x01'+p.t+'\x02':p.t;
  const lines=full.split('\n');
  let html='',seen=false;
  for(const raw of lines){
    const plain=raw.replace(/\x01|\x02/g,'').trim();
    if(!plain)continue;
    let bc=0,tc=0,inB=false;
    for(let j=0;j<raw.length;j++){
      if(raw[j]==='\x01'){inB=true;continue;}if(raw[j]==='\x02'){inB=false;continue;}
      if(raw[j].trim()){tc++;if(inB)bc++;}
    }
    const isBold=tc>0&&bc/tc>=0.5;
    if(/^B[\.\s]/i.test(plain)&&seen)html+='<span class="wod-div"></span>';
    if(/^[AB][\.\s]/i.test(plain))seen=true;
    const e=plain.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html+=isBold?'<span class="wod-bold">'+e+'</span>':'<span class="wod-line">'+e+'</span>';
  }
  return html||null;
}

function fmtWOD(text,htmlSrc){
  if(!text||!text.trim())return'<span class="wod-empty">Sin planificación</span>';
  if(htmlSrc){const r=parseHTMLSource(htmlSrc);if(r)return r;}
  // Fallback: texto plano
  const lines=text.split('\n').map(l=>l.trim());
  let html='';
  for(let i=0;i<lines.length;i++){
    const l=lines[i];if(!l)continue;
    if(/^B[\.\s]/i.test(l)&&i>0)html+='<span class="wod-div"></span>';
    const e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html+='<span class="wod-line">'+e+'</span>';
  }
  return html;
}

/* ── LAYOUT DETECTION ── */
function getA(t){return extractBlock(t,'A');}
function getB(t){return extractBlock(t,'B');}

function detectLayout(cf,fun,gap,cloneOf){
  const texts=[cf,fun,gap];
  const eq=(a,b)=>a&&b&&a.trim()===b.trim();

  if(cloneOf){
    const cs=cloneOf.cf,fs=cloneOf.fun,gs=cloneOf.gap;
    if(fs==='cf'&&gs==='cf')return{type:'all3',text:cf};
    if(cs==='fun'&&gs==='fun')return{type:'all3',text:fun};
    if(cs==='gap'&&fs==='gap')return{type:'all3',text:gap};
    if(fs==='cf'||cs==='fun')return{type:'2same',merged:[0,1],solo:2};
    if(gs==='fun'||fs==='gap')return{type:'2same',merged:[1,2],solo:0};
    if(gs==='cf'||cs==='gap')return{type:'2same',merged:[0,2],solo:1};
  }

  const aB=texts.map(getA),bB=texts.map(getB);
  if(eq(texts[0],texts[1])&&eq(texts[0],texts[2]))return{type:'all3',text:texts[0]};
  if(eq(texts[0],texts[1]))return{type:'2same',merged:[0,1],solo:2};
  if(eq(texts[1],texts[2]))return{type:'2same',merged:[1,2],solo:0};
  if(eq(texts[0],texts[2]))return{type:'2same',merged:[0,2],solo:1};
  if(eq(aB[0],aB[1])&&eq(aB[0],aB[2]))return{type:'sharedA3',sharedA:aB[0],bBlocks:bB};
  if(eq(aB[0],aB[1])&&!eq(aB[0],aB[2]))return{type:'sharedA2',shared:[0,1],solo:2,sharedA:aB[0],bBlocks:bB};
  if(eq(aB[1],aB[2])&&!eq(aB[0],aB[1]))return{type:'sharedA2',shared:[1,2],solo:0,sharedA:aB[1],bBlocks:bB};
  if(eq(aB[0],aB[2])&&!eq(aB[0],aB[1]))return{type:'sharedA2',shared:[0,2],solo:1,sharedA:aB[0],bBlocks:bB};
  return{type:'3col'};
}

/* ── BUILD DAY HTML ── */
function buildDay(name,date,cf,fun,gap,cloneOf,cfH,funH,gapH){
  const texts=[cf,fun,gap],hArr=[cfH,funH,gapH];
  const L=detectLayout(cf,fun,gap,cloneOf);

  function w(i,t,h){return'<div class="wod-text">'+fmtWOD(t,h)+'</div>';}
  function col(style,content){return'<div class="disc-col" style="'+style+'">'+content+'</div>';}
  function hdr(style,label){return'<div class="disc-hdr" style="'+style+'">'+label+'</div>';}

  let hdrs='',body='';

  if(L.type==='all3'){
    hdrs='<div class="disc-headers" style="grid-template-columns:1fr;"><div class="disc-hdr">CROSSFIT · FUNCIONAL · GAP</div></div>';
    body='<div class="disc-body" style="grid-template-columns:1fr;">'+col('',w(0,L.text,cfH||funH||gapH))+'</div>';
  }else if(L.type==='2same'){
    const mi=L.merged,si=L.solo;
    const mL=mi.map(i=>DISC[i]).join(' · '),sL=DISC[si];
    if(si===2){
      hdrs='<div class="disc-headers" style="grid-template-columns:2fr 1fr;"><div class="disc-hdr" style="grid-column:span 2;">'+mL+'</div><div class="disc-hdr">'+sL+'</div></div>';
      body='<div class="disc-body" style="grid-template-columns:2fr 1fr;">'+col('grid-column:span 2',w(mi[0],texts[mi[0]],hArr[mi[0]]))+col('',w(si,texts[si],hArr[si]))+'</div>';
    }else if(si===0){
      hdrs='<div class="disc-headers" style="grid-template-columns:1fr 2fr;"><div class="disc-hdr">'+sL+'</div><div class="disc-hdr" style="grid-column:span 2;">'+mL+'</div></div>';
      body='<div class="disc-body" style="grid-template-columns:1fr 2fr;">'+col('',w(si,texts[si],hArr[si]))+col('grid-column:span 2',w(mi[0],texts[mi[0]],hArr[mi[0]]))+'</div>';
    }else{
      hdrs='<div class="disc-headers" style="grid-template-columns:1fr 1fr 1fr;">'+DISC.map(d=>'<div class="disc-hdr">'+d+'</div>').join('')+'</div>';
      body='<div class="disc-body" style="grid-template-columns:1fr 1fr 1fr;">'+texts.map((t,i)=>col('',w(i,t,hArr[i]))).join('')+'</div>';
    }
  }else if(L.type==='sharedA3'){
    hdrs='<div class="disc-headers" style="grid-template-columns:1fr 1fr 1fr;">'+DISC.map(d=>'<div class="disc-hdr">'+d+'</div>').join('')+'</div>';
    const allBEmpty=L.bBlocks.every(b=>!b||!b.trim());
    if(allBEmpty){
      body='<div class="disc-body" style="grid-template-columns:1fr;">'+col('grid-column:span 3',w(0,L.sharedA,null))+'</div>';
    }else{
      body='<div><div class="shared-row">'+w(0,L.sharedA,null)+'</div><div class="disc-body" style="grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--div);">'+L.bBlocks.map((b,i)=>col('',w(i,b,null))).join('')+'</div></div>';
    }
  }else if(L.type==='sharedA2'){
    const sd=L.shared,si=L.solo;
    hdrs='<div class="disc-headers" style="grid-template-columns:1fr 1fr 1fr;">'+DISC.map(d=>'<div class="disc-hdr">'+d+'</div>').join('')+'</div>';
    if(sd[0]===0&&sd[1]===1){
      body='<div style="display:grid;grid-template-columns:2fr 1fr;flex:1;min-height:0;"><div style="display:flex;flex-direction:column;"><div class="shared-row" style="flex-shrink:0;">'+w(0,L.sharedA,null)+'</div><div style="display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;border-top:1px solid var(--div);">'+col('',w(0,L.bBlocks[0],null))+col('',w(1,L.bBlocks[1],null))+'</div></div>'+col('border-left:1px solid var(--div)',w(2,texts[2],hArr[2]))+'</div>';
    }else if(sd[0]===1&&sd[1]===2){
      body='<div style="display:grid;grid-template-columns:1fr 2fr;flex:1;min-height:0;">'+col('border-right:1px solid var(--div)',w(0,texts[0],hArr[0]))+'<div style="display:flex;flex-direction:column;"><div class="shared-row" style="flex-shrink:0;">'+w(0,L.sharedA,null)+'</div><div style="display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;border-top:1px solid var(--div);">'+col('',w(1,L.bBlocks[1],null))+col('',w(2,L.bBlocks[2],null))+'</div></div></div>';
    }else{
      body='<div class="disc-body" style="grid-template-columns:1fr 1fr 1fr;">'+texts.map((t,i)=>col('',w(i,t,hArr[i]))).join('')+'</div>';
    }
  }else{
    hdrs='<div class="disc-headers" style="grid-template-columns:1fr 1fr 1fr;">'+DISC.map(d=>'<div class="disc-hdr">'+d+'</div>').join('')+'</div>';
    body='<div class="disc-body" style="grid-template-columns:1fr 1fr 1fr;">'+texts.map((t,i)=>col('',w(i,t,hArr[i]))).join('')+'</div>';
  }

  return'<div class="canva-card"><div class="card-top"><span class="card-day-name">'+name+'</span><span class="card-day-date">'+date+'</span></div>'+hdrs+body+'</div>';
}

/* ── RENDER APP ── */
function renderApp(){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderTabs();
  renderWeek(currentWeek);
}

function renderTabs(){
  const vis=getVisible(currentWeek);
  const el=document.getElementById('week-tabs');el.innerHTML='';
  vis.forEach(idx=>{
    const btn=document.createElement('button');
    btn.className='week-tab'+(idx===currentWeek?' active':'');
    btn.textContent=weekLabel(allWeeks[idx]);
    btn.onclick=()=>selectWeek(idx);
    el.appendChild(btn);
  });
}

function selectWeek(idx){currentWeek=idx;currentDay=0;renderTabs();renderWeek(idx);}

function renderWeek(idx){
  const w=allWeeks[idx];
  const nav=document.getElementById('day-nav');nav.innerHTML='';
  DAYS_ES.forEach((name,d)=>{
    const btn=document.createElement('button');
    btn.className='day-btn'+(d===currentDay?' active':'');
    const ds=fmt(w.lunes,d);
    btn.innerHTML=name+'<br><small style="font-weight:300;font-size:9px;letter-spacing:0;">'+ds+'</small>';
    btn.onclick=()=>selectDay(d);
    nav.appendChild(btn);
  });
  const wrap=document.getElementById('days-wrap');wrap.innerHTML='';
  DAYS_ES.forEach((name,d)=>{
    const r=resolveDay(w.days[d]);
    const date=fmt(w.lunes,d);
    const slide=document.createElement('div');
    slide.className='day-slide'+(d===currentDay?' active':'');
    slide.id='day-'+d;
    slide.innerHTML=buildDay(name,date,r.cf,r.fun,r.gap,r.cloneOf,r.cfH,r.funH,r.gapH);
    wrap.appendChild(slide);
  });
}

function selectDay(idx){
  currentDay=idx;
  document.querySelectorAll('.day-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.day-slide').forEach((s,i)=>s.classList.toggle('active',i===idx));
}

function toggleFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }else document.exitFullscreen();
}

document.addEventListener('fullscreenchange',()=>{
  const appH=document.querySelector('.app-header');
  const dayN=document.querySelector('.day-nav');
  if(document.fullscreenElement){
    appH.style.display='none';dayN.style.display='none';
  }else{
    appH.style.display='';dayN.style.display='';
  }
});

document.addEventListener('keydown',e=>{
  if(document.getElementById('app').style.display==='none')return;
  if(e.key==='ArrowRight'&&currentDay<5)selectDay(currentDay+1);
  if(e.key==='ArrowLeft'&&currentDay>0)selectDay(currentDay-1);
});

// Start
loadData();
</script>
